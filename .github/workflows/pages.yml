# Publishes docs/site/ to GitHub Pages. There is no build step: the files are copied as they are.
# One time setup in the repository: Settings, Pages, Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publishes only from main. A branch or a pull request never deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A copy, not a build. Design notes live beside the site and must not be published.
      - name: Stage the public files
        run: |
          mkdir _site
          cp -r docs/site/. _site/
          rm -rf _site/.impeccable _site/PRODUCT.md _site/DESIGN.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
